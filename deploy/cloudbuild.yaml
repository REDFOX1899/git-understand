# =============================================================================
# GitUnderstand (git-understand.com) — Google Cloud Build Pipeline
# Automated CI/CD for Cloud Run Deployment (api.git-understand.com)
# =============================================================================

steps:
  # ---------------------------------------------------------------------------
  # Step 1: Pull prior image for Docker layer cache acceleration
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest || exit 0

  # ---------------------------------------------------------------------------
  # Step 2: Build container image using deploy/Dockerfile
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '--cache-from'
      - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest'
      - '-t'
      - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'deploy/Dockerfile'
      - '.'

  # ---------------------------------------------------------------------------
  # Step 3: Push versioned and latest tags to Google Artifact Registry
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}'

  # ---------------------------------------------------------------------------
  # Step 4: Deploy container revision to Google Cloud Run
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '${_MEMORY}'
      - '--cpu'
      - '${_CPU}'
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--concurrency'
      - '${_CONCURRENCY}'
      - '--timeout'
      - '${_TIMEOUT}'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=8080,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},CLOUD_RUN_SERVICE=${_SERVICE_NAME}'

images:
  - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
  - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest'

substitutions:
  _SERVICE_NAME: 'git-understand-engine'
  _REGION: 'us-central1'
  _AR_HOSTNAME: 'us-central1-docker.pkg.dev'
  _AR_REPO: 'git-understand'
  _CPU: '2'
  _MEMORY: '2Gi'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _CONCURRENCY: '80'
  _TIMEOUT: '300s'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
